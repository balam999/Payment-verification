<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B enhanced - AI Photo Enhancer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-shadow {
            box-shadow: 0 20px 40px rgba(147, 51, 234, 0.15);
        }
        .btn-3d {
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #581c87, 0 12px 20px rgba(147, 51, 234, 0.3);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #581c87, 0 6px 10px rgba(147, 51, 234, 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-purple-600 selection:text-white">

    <div class="max-w-md w-full bg-white border border-purple-100 rounded-3xl card-shadow p-6 sm:p-8 relative overflow-hidden">
        
        <!-- App Title -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-purple-700">
                B enhanced
            </h1>
            <p class="text-slate-500 text-xs mt-1">রিমিনির মতো এক ক্লিকে ঝাপসা ছবি করুন ক্রিস্টাল ক্লিয়ার</p>
        </div>

        <!-- Upload Box -->
        <div id="drop-zone" class="border-2 border-dashed border-purple-300 hover:border-purple-500 rounded-2xl p-6 text-center cursor-pointer transition-all duration-300 bg-purple-50/50 hover:bg-purple-50 relative group">
            <input type="file" id="file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
            <div id="upload-prompt" class="flex flex-col items-center">
                <div class="w-14 h-14 rounded-2xl bg-purple-100 border border-purple-200 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform text-purple-600 shadow-sm">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <p class="text-sm font-semibold text-purple-900">ছবি আপলোড করতে এখানে ক্লিক করুন</p>
                <p class="text-xs text-slate-400 mt-0.5">PNG, JPG বা WEBP ফরম্যাট</p>
            </div>
            <img id="preview-img" class="hidden max-h-56 mx-auto rounded-xl object-contain shadow-md" alt="Uploaded Preview">
        </div>

        <!-- 3D Action Button -->
        <button id="enhance-btn" class="w-full mt-6 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 px-4 rounded-2xl btn-3d disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none flex items-center justify-center space-x-2" disabled>
            <svg class="w-5 h-5 animate-spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <span>ফটো এহেন্স করুন</span>
        </button>

        <!-- Loading State -->
        <div id="loading" class="hidden mt-6 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-600 border-t-transparent"></div>
            <p class="text-xs font-medium text-purple-700 mt-2">এআই দিয়ে ছবি পরিষ্কার করা হচ্ছে, দয়া করে অপেক্ষা করুন...</p>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="hidden mt-6 border-t border-purple-100 pt-5 text-center">
            <h2 class="text-sm font-bold text-purple-900 mb-3">এহেন্স করা ফাইনাল ছবি</h2>
            <div class="bg-purple-50/60 p-3 rounded-2xl border border-purple-200">
                <img id="result-img" class="max-h-72 mx-auto rounded-xl object-contain mb-4 shadow-lg bg-white p-1" alt="Enhanced Result">
                <a id="download-btn" class="inline-block w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-md text-sm" download="b-enhanced-photo.png">
                    সরাসরি ডাউনলোড করুন
                </a>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadPrompt = document.getElementById('upload-prompt');
        const previewImg = document.getElementById('preview-img');
        const enhanceBtn = document.getElementById('enhance-btn');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('result-section');
        const resultImg = document.getElementById('result-img');
        const downloadBtn = document.getElementById('download-btn');

        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (event) => {
                    previewImg.src = event.target.result;
                    previewImg.classList.remove('hidden');
                    uploadPrompt.classList.add('hidden');
                    enhanceBtn.disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });

        enhanceBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            loading.classList.remove('hidden');
            enhanceBtn.disabled = true;
            resultSection.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('https://www.cutout.pro/api/v1/photoEnhance', {
                    method: 'POST',
                    headers: {
                        'APIKEY': '56a65ea24c0742408b516c6e7b08bacc'
                    },
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    
                    resultImg.src = imageUrl;
                    downloadBtn.href = imageUrl;
                    resultSection.classList.remove('hidden');
                } else {
                    alert('ছবি প্রসেস করতে সমস্যা হয়েছে। এপিআই ব্যালেন্স বা ক্রেডিট শেষ হয়ে থাকতে পারে।');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('নেটওয়ার্ক ত্রুটি ঘটেছে। দয়া করে ইন্টারনেট কানেকশন চেক করুন।');
            } finally {
                loading.classList.add('hidden');
                enhanceBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
