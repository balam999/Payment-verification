<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .downloader-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .downloader-card h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .downloader-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .input-group input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
        }
        .download-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .download-btn:hover {
            opacity: 0.9;
        }
        #result {
            margin-top: 25px;
        }
        .loading {
            color: #667eea;
            font-weight: 500;
        }
        .success-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .success-box img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .success-box a {
            display: inline-block;
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
        }
        .success-box a:hover {
            background: #218838;
        }
        .error-msg {
            color: #dc3545;
            background: #f8d7da;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="downloader-card">
    <h2><i class="fa-solid fa-cloud-arrow-down"></i> Video Downloader</h2>
    <p>আপনার পছন্দের ভিডিওর লিংক নিচে পেস্ট করুন</p>
    
    <div class="input-group">
        <i class="fa-solid fa-link"></i>
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
    </div>
    
    <button class="download-btn" onclick="processDownload()">লিংক জেনারেট করুন</button>
    
    <div id="result"></div>
</div>

<script>
    // ইউটিউব লিংক থেকে ভিডিও আইডি বের করার ফাংশন
    function getYouTubeId(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    async function processDownload() {
        const url = document.getElementById('videoUrl').value.trim();
        const resultDiv = document.getElementById('result');

        if (!url) {
            resultDiv.innerHTML = `<div class="error-msg">দয়া করে একটি সঠিক ভিডিও লিংক দিন!</div>`;
            return;
        }

        resultDiv.innerHTML = `<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> থাম্বনেইল ও লিংক প্রসেসিং হচ্ছে...</div>`;

        const apiKey = "0472fe22d1ebfdaa9229bc9a00b827dae847703c";
        const apiUrl = `https://s.savenow.to/api/v2/download?format=mp4&url=${encodeURIComponent(url)}`;

        let thumbnailUrl = "https://via.placeholder.com/480x270?text=Video+Thumbnail";
        const ytId = getYouTubeId(url);
        if (ytId) {
            thumbnailUrl = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
        }

        try {
            const response = await fetch(apiUrl, {
                method: "GET",
                headers: {
                    "x-api-key": apiKey
                }
            });

            const data = await response.json();
            const downloadLink = (data && data.url) ? data.url : url;

            resultDiv.innerHTML = `
                <div class="success-box">
                    <img src="${thumbnailUrl}" alt="Thumbnail">
                    <p style="color: #28a745; font-weight: 600; margin-bottom: 5px;"><i class="fa-solid fa-circle-check"></i> ডাউনলোড প্রস্তুত!</p>
                    <a href="${downloadLink}" download="Video Downloader.mp4" target="_blank">
                        <i class="fa-solid fa-download"></i> ভিডিও ডাউনলোড করুন
                    </a>
                </div>
            `;

        } catch (error) {
            // কোনো কারণে এপিআই ব্লক করলে বা ফেচ ফেইল করলে সরাসরি ডাইরেক্ট ডাউনলোডের ব্যবস্থা
            resultDiv.innerHTML = `
                <div class="success-box">
                    <img src="${thumbnailUrl}" alt="Thumbnail">
                    <p style="color: #28a745; font-weight: 600; margin-bottom: 5px;"><i class="fa-solid fa-circle-check"></i> প্রস্তুত!</p>
                    <a href="${url}" download="Video Downloader.mp4" target="_blank">
                        <i class="fa-solid fa-download"></i> ভিডিও ডাউনলোড করুন
                    </a>
                </div>
            `;
        }
    }
</script>

</body>
</html>
